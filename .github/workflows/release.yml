# Сборка выпуска: метка vX.Y.Z → GitHub собирает Windows и Linux и выкладывает Release.
#   1. Поменять version в Cargo.toml (например, 0.7.0) и закоммитить.
#   2. git tag v0.7.0 && git push && git push --tags
# Foxray у всех увидит новую версию в «Настройки → Обновление».
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SINGBOX: "1.12.12"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Версия метки = версии в Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "Метка v$tag, а в Cargo.toml $ver" }
      - run: cargo build --release --bin foxray-gui
      - name: Архив
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$env:SINGBOX/sing-box-$env:SINGBOX-windows-amd64.zip" -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sb
          New-Item -ItemType Directory -Force dist/Foxray | Out-Null
          Copy-Item target/release/foxray-gui.exe dist/Foxray/Foxray.exe
          Get-ChildItem sb -Recurse -Include sing-box.exe, *.dll | Copy-Item -Destination dist/Foxray/
          Get-ChildItem sb -Recurse -Filter LICENSE | Select-Object -First 1 | Copy-Item -Destination "dist/Foxray/sing-box LICENSE.txt"
          Copy-Item "dist-files/Прочти меня.txt" dist/Foxray/
          Compress-Archive -Path dist/Foxray -DestinationPath "dist/Foxray-$v-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  linux:
    # Сборка через zig под glibc 2.31 — запускается на Ubuntu 20.04 / Debian 11 и новее.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libfontconfig1-dev
          pip install ziglang
          cargo install cargo-zigbuild --locked
      - run: PKG_CONFIG_ALLOW_CROSS=1 cargo zigbuild --release --bin foxray-gui --target x86_64-unknown-linux-gnu.2.31
      - name: Архив
        run: |
          v="${GITHUB_REF_NAME#v}"
          curl -sSLf -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX}/sing-box-${SINGBOX}-linux-amd64.tar.gz"
          mkdir -p sb && tar -xzf sb.tgz -C sb --strip-components=1
          out=dist/foxray && mkdir -p "$out"
          cp target/x86_64-unknown-linux-gnu/release/foxray-gui "$out/foxray"
          cp sb/sing-box "$out/sing-box"
          cp sb/LICENSE "$out/sing-box LICENSE.txt"
          cp ui/icon.png "$out/foxray.png"
          cp dist-files/linux/* "$out/"
          chmod +x "$out/foxray" "$out/sing-box" "$out/install-menu.sh"
          tar -czf "dist/Foxray-${v}-linux-x86_64.tar.gz" -C dist foxray
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
